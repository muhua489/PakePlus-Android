<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:linear-gradient(180deg,#ffd9ec 0%,#e6f4ff 60%,#fff6e8 100%);
  display:flex;justify-content:center;align-items:center;
  font-family:'ZCOOL KuaiLe','Press Start 2P',monospace;
  overflow:hidden;
  touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#stage{
  position:relative;--k:1;
  width:min(960px,100vw,calc(100vh * 16 / 9));
  aspect-ratio:16/9;
  max-height:100vh;
}
#wrap{
  position:absolute;top:50%;left:50%;
  width:960px;height:540px;
  transform:translate(-50%,-50%) scale(var(--k));
  border-radius:14px;overflow:hidden;
  box-shadow:0 12px 40px rgba(230,120,170,.35),0 0 0 6px rgba(255,255,255,.6);
  background:#bfe6ff;
}
canvas{display:block;width:100%;height:100%;image-rendering:auto}
/* HUD */
#hud{position:absolute;inset:0 0 auto 0;display:flex;justify-content:space-between;align-items:flex-start;padding:10px 14px;pointer-events:none;z-index:20}
.pill{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.75);border:2px solid rgba(255,255,255,.9);border-radius:999px;padding:5px 14px;box-shadow:0 3px 0 rgba(190,140,170,.25)}
.coin-ico{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2ae,#ffd24a 55%,#e8a818);border:2px solid #c98a12;box-shadow:0 0 6px rgba(255,210,74,.8)}
#hud .num{font-family:'Press Start 2P',monospace;font-size:13px;color:#8a5a2b}
#hud .lbl{font-size:12px;color:#c98aa8}
#hearts span{font-size:16px;color:#ff5f8f;text-shadow:0 2px 0 rgba(200,60,110,.3);margin:0 1px}
#hearts span.off{color:#d8c8d4}
#lvl-pill{flex-direction:column;gap:1px;padding:5px 18px}
#lvl-name{font-size:14px;color:#b05a86;letter-spacing:2px}
#hud-time{font-family:'Press Start 2P',monospace;font-size:11px;color:#7a9ac8}
/* toast */
#toast{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:22;pointer-events:none;font-size:16px;color:#e0568a;background:rgba(255,255,255,.85);border-radius:999px;padding:6px 18px;opacity:0;transition:opacity .25s;box-shadow:0 3px 10px rgba(200,100,150,.25)}
#toast.show{opacity:1}
/* overlays */
.overlay{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:rgba(255,240,248,.88);backdrop-filter:blur(3px)}
.overlay.hidden{display:none}
h1.title{font-size:46px;color:#f0569a;letter-spacing:8px;text-shadow:0 3px 0 #fff,0 6px 0 rgba(220,120,170,.35);margin-bottom:6px}
h2.sub{font-size:16px;color:#8fb8d8;letter-spacing:6px;margin-bottom:26px}
.ovl-name{font-family:'Press Start 2P',monospace;font-size:15px;color:#c8a05a;letter-spacing:3px;margin-bottom:8px}
.ovl-title{font-size:34px;color:#f0569a;text-shadow:0 3px 0 #fff;margin-bottom:10px}
.ovl-tip{font-size:14px;color:#a08ab8;line-height:2;margin-bottom:26px}
.btn{font-family:inherit;font-size:20px;letter-spacing:4px;color:#fff;background:linear-gradient(180deg,#ff9ec4,#f0569a);border:none;border-radius:999px;padding:13px 52px;cursor:pointer;box-shadow:0 5px 0 #c9437d,0 8px 16px rgba(220,90,150,.35);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #c9437d}
.btn.ghost{background:rgba(255,255,255,.9);color:#f0569a;box-shadow:0 5px 0 #e0b8cc}
.stat-row{display:flex;gap:26px;margin:8px 0 22px}
.stat{display:flex;flex-direction:column;gap:4px}
.stat b{font-family:'Press Start 2P',monospace;font-size:16px;color:#8a5a2b}
.stat i{font-style:normal;font-size:12px;color:#b09ac0;letter-spacing:2px}
.controls-hint{margin-top:24px;font-size:13px;color:#b8a0c0;line-height:2}
kbd{background:#fff;border:1px solid #e0c8d8;border-bottom-width:3px;border-radius:6px;padding:1px 8px;font-family:inherit;font-size:12px;color:#d0709a}
/* fox mini preview */
#fox-preview{margin-bottom:14px;image-rendering:pixelated}
/* mobile controls */
#mob{display:none;position:absolute;inset:auto 0 0 0;height:132px;z-index:40;pointer-events:none}
#mob.show{display:block}
.mbtn{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:70px;height:70px;border-radius:50%;border:2px solid rgba(255,255,255,.85);background:rgba(255,255,255,.42);color:#e0568a;font-size:26px;display:flex;justify-content:center;align-items:center;pointer-events:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:0 3px 10px rgba(200,110,160,.28)}
.mbtn.on,.mbtn:active{background:rgba(255,255,255,.9);transform:translateY(2px)}
#m-left{left:calc(18px + env(safe-area-inset-left,0px))}#m-right{left:calc(104px + env(safe-area-inset-left,0px))}
#m-jump{right:calc(22px + env(safe-area-inset-right,0px));width:88px;height:88px;font-size:34px}
@media(pointer:coarse){#mob{display:block}}
/* 竖屏手机：把整个舞台旋转 90°，让 16:9 画面铺满屏幕 */
body.rot #stage{
  position:fixed;top:50%;left:50%;
  width:min(100vh,calc(100vw * 16 / 9));
  height:min(100vw,calc(100vh * 9 / 16));
  max-height:none;aspect-ratio:auto;
  transform:translate(-50%,-50%) rotate(90deg);
}
body.rot #wrap{border-radius:0;box-shadow:none}
</style>
</head>

<script>
'use strict';
/* ================= 基础 ================= */
const cvs=document.getElementById('game'),ctx=cvs.getContext('2d');
const W=960,H=540,GY=460; // 地面高度
const GRAV=0.55, JUMPV=-13.5, MAXFALL=14;
const SPEED=4.6, ACCEL=0.7;

/* ================= 音效 ================= */
let AC=null, muted=false;
function ac(){if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();return AC;}
function tone(f,d,type='square',v=0.07,slide=0){
  if(muted)return;const a=ac(),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,a.currentTime);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),a.currentTime+d);
  g.gain.setValueAtTime(v,a.currentTime);g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+d);
  o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+d);
}

/* ================= 碰撞 ================= */
function overlaps(a,b){
  return a.x+a.w/2>b.x&&a.x-a.w/2<b.x+b.w&&a.y+a.h/2>b.y&&a.y-a.h/2<b.y+b.h;
}
function hitBlock(b){
  if(b.type==='question'&&!b.used){
    b.used=true;b.bump=10;
    popCoins.push({x:b.x+16,y:b.y-8,vy:-7.5,life:36});
    sCoin();
  }else if(b.type==='brick'){
    b.dead=true;sBreak();burst(b.x+16,b.y+16,'#dd8a5f',12,4,0.25);score+=50;floatText(b.x+16,b.y,'+50');
  }else sBump();
}
function physics(){
  const p=player;
  // 输入
  let dir=0;
  if(keys['ArrowLeft']||keys['a']||keys['A']||mL)dir-=1;
  if(keys['ArrowRight']||keys['d']||keys['D']||mR)dir+=1;
  if(dir!==0){p.vx+=dir*ACCEL;p.facing=dir;if(Math.abs(p.vx)>SPEED)p.vx=dir*SPEED;}
  else{p.vx*=0.78;if(Math.abs(p.vx)<0.2)p.vx=0;}
  // 跳跃缓冲 & 土狼时间
  if(p.jbuf>0)p.jbuf--;
  if(p.coyote>0)p.coyote--;
  if(p.jbuf>0&&(p.onGround||p.coyote>0)){
    p.vy=JUMPV;p.jbuf=0;p.coyote=0;p.onGround=false;p.jumps=1;sJump();
    dust(p.x,p.y+p.h/2);
    p.expr='normal';
  }else if(p.jbuf>0&&p.jumps<2){ // 二段跳：高度为一段跳的 1/3
    p.vy=p.jumps===0?JUMPV:JUMPV/Math.sqrt(3);
    p.jbuf=0;p.jumps++;sJump();
    dust(p.x,p.y+p.h/2);
    p.expr='normal';
  }
  p.vy+=GRAV;if(p.vy>MAXFALL)p.vy=MAXFALL;
  p.fallSpd=Math.max(p.fallSpd,p.vy);
  // Y 轴
  p.y+=p.vy;
  const wasGround=p.onGround;p.onGround=false;p.standing=null;
  for(const b of level.blocks){
    if(b.dead)continue;
    if(overlaps(p,b)){
      if(p.vy>0){ // 下落着陆
        p.y=b.y-p.h/2;
        if(!wasGround&&p.fallSpd>10)dust(p.x,p.y+p.h/2);
        p.vy=0;p.onGround=true;p.standing=b;p.fallSpd=0;p.jumps=0;
      }else if(p.vy<0){ // 上升顶头
        p.y=b.y+b.h+p.h/2;p.vy=1;hitBlock(b);
      }
    }
  }
  if(p.onGround)p.coyote=7;
  // X 轴
  p.x+=p.vx;
  for(const b of level.blocks){
    if(b.dead)continue;
    if(overlaps(p,b)){
      if(p.vx>0)p.x=b.x-p.w/2;else if(p.vx<0)p.x=b.x+b.w+p.w/2;
      p.vx=0;
    }
  }
  p.x=Math.max(p.w/2,Math.min(level.width-p.w/2,p.x));
  // 表情计时
  if(p.exprT>0){p.exprT--;if(p.exprT===0)p.expr='normal';}
  if(p.inv>0)p.inv--;
  // 眨眼
  p.blinkT--;if(p.blinkT<=0){p.blink=5;p.blinkT=130+Math.random()*120;}
  if(p.blink>0)p.blink--;
  // 跑动尘土
  if(p.onGround&&Math.abs(p.vx)>2){p.runDust--;if(p.runDust<=0){dust(p.x-p.facing*8,p.y+p.h/2-2);p.runDust=14;}}
}
function hurtPlayer(fromX){
  const p=player;
  if(p.inv>0)return;
  p.hearts--;p.inv=95;p.expr='hurt';p.exprT=80;
  p.vx=(p.x<fromX?-1:1)*5.5;p.vy=-7.5;shake=12;sHurt();updateHUD();
  burst(p.x,p.y,'#ff8fb8',12,4,0.1);
  if(p.hearts<=0)gameOver();
}
function fallOut(){
  const p=player;p.hearts--;sHurt();shake=10;updateHUD();
  if(p.hearts<=0){gameOver();return;}
  const sx=(checked&&level.checkX)?level.checkX-40:level.spawn.x;
  p.x=sx;p.y=level.spawn.y-60;p.vx=0;p.vy=0;p.inv=110;p.expr='hurt';p.exprT=70;
  camX=Math.max(0,Math.min(level.width-W,p.x-W*0.35));
}

/* ================= 更新 ================= */
function update(){
  frame++;
  if(state==='intro'){introT++;if(introT>95)skipIntro();updateAmbient();return;}
  if(state==='clear'||state==='win'){
    updateAmbient();
    confetti.forEach(c=>{c.x+=c.vx;c.y+=c.vy;c.vy+=0.12;c.rot+=c.vr;});
    particles.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=pt.grav;pt.life--;});
    particles=particles.filter(pt=>pt.life>0);
    return;
  }
  if(state!=='playing'){updateAmbient();return;}
  // 计时
  if(frame%60===0){timer--;document.getElementById('hud-time').textContent='TIME '+timer;
    if(timer<=0){fallOut();timer=level.time;if(state==='playing')toast('时间到！失去一颗心');}}
  physics();
  // 移动平台
  for(const b of level.blocks){
    if(b.type!=='moving')continue;
    b.px=b.x;b.py=b.y;
    const d=b.dir*b.speed;
    if(b.axis==='x'){b.x+=d;if(Math.abs(b.x-b.ox)>b.range)b.dir*=-1;}
    else{b.y+=d*0.8;if(Math.abs(b.y-b.oy)>b.range)b.dir*=-1;}
    if(player.standing===b){player.x+=b.x-b.px;player.y+=b.y-b.py;}
    if(b.bump>0)b.bump--;
  }
  level.blocks.forEach(b=>{if(b.bump>0)b.bump--;});
  // 弹出的金币
  popCoins.forEach(c=>{c.vy+=0.35;c.y+=c.vy;c.life--;});
  popCoins=popCoins.filter(c=>{
    if(c.life<=0){coinsLv++;score+=100;player.expr='happy';player.exprT=45;
      sparkle(c.x,c.y);floatText(c.x,c.y-10,'+100');updateHUD();return false;}
    return true;
  });
  // 金币
  level.coins.forEach(c=>{
    if(c.taken)return;
    const cy=c.y+Math.sin(frame*0.07+c.x)*3;
    if(Math.abs(player.x-c.x)<24&&Math.abs(player.y-cy)<30){
      c.taken=true;coinsLv++;score+=100;player.expr='happy';player.exprT=45;
      sCoin();sparkle(c.x,cy);floatText(c.x,cy-10,'+100');updateHUD();
      if(coinsLv%50===0&&player.hearts<3){player.hearts++;updateHUD();toast('金币加成 恢复一颗心！');sHeart();}
    }
  });
  // 爱心道具
  if(level.heart&&!level.heart.taken){
    const h=level.heart,hy=h.y+Math.sin(frame*0.06)*4;
    if(Math.abs(player.x-h.x)<26&&Math.abs(player.y-hy)<30){
      h.taken=true;
      if(player.hearts<3){player.hearts++;toast('恢复一颗心！');}else{score+=500;floatText(h.x,h.y,'+500');}
      sHeart();updateHUD();sparkle(h.x,hy);
    }
  }
  // 敌人
  level.enemies.forEach(e=>{
    if(e.dead){e.squash++;return;}
    e.t+=0.08;
    if(e.type==='bee'){
      e.y=e.oy+Math.sin(e.t)*22;e.x+=Math.sin(e.t*0.5)*0.6;
    }else{
      e.x+=e.dir*e.speed;
      if(e.x<e.min||e.x>e.max)e.dir*=-1;
    }
    // 碰撞
    if(Math.abs(player.x-e.x)<(player.w+e.w)/2-2&&Math.abs(player.y-e.y)<(player.h+e.h)/2-2){
      const fromAbove=player.vy>0.5&&(player.y+player.h/2)-e.y<e.h*0.6;
      if(fromAbove&&e.type!=='spiky'){
        e.dead=true;e.squash=0;sStomp();
        player.vy=keys[' ']||keys['ArrowUp']||keys['w']||mJ?-10:-7;
        score+=200;floatText(e.x,e.y-14,'+200');
        burst(e.x,e.y,'#b8f0c0',10,3,0.15);updateHUD();
        player.expr='happy';player.exprT=30;
      }else hurtPlayer(e.x);
    }
  });
  level.enemies=level.enemies.filter(e=>!e.dead||e.squash<14);
  // 掉坑
  if(player.y>H+90)fallOut();
  // 存档旗
  if(level.checkX&&!checked&&player.x>level.checkX){checked=true;sCheck();toast('已记录存档点！');}
  // 终点
  if(player.x+player.w/2>=level.goalX&&player.y+player.h/2>GY-60){levelClear();}
  // 相机
  const target=Math.max(0,Math.min(level.width-W,player.x-W*0.42));
  camX+=(target-camX)*0.09;
  if(shake>0)shake--;
  // 粒子
  particles.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=pt.grav;pt.life--;});
  particles=particles.filter(pt=>pt.life>0);
  floaters.forEach(f=>{f.y-=0.8;f.life--;});
  floaters=floaters.filter(f=>f.life>0);
  updateAmbient();
  updateHUD();
}
function updateAmbient(){
  petals.forEach(pt=>{pt.y+=pt.sp;pt.x+=Math.sin(frame*0.02+pt.ph)*0.6-0.3;pt.rot+=0.02;if(pt.y>H+10){pt.y=-10;pt.x=Math.random()*W;}});
  fireflies.forEach(f=>{f.ph+=0.03;f.x+=Math.sin(f.ph)*0.5;f.y+=Math.cos(f.ph*0.7)*0.4;});
  cloudsBg.forEach(c=>{c.x+=c.v;if(c.x>W+120)c.x=-160;});
  confetti.forEach(c=>{c.x+=c.vx;c.y+=c.vy;c.vy+=0.12;c.rot+=c.vr;});
}
function updateHUD(){
  document.getElementById('ui-coins').textContent=coinsLv;
  document.getElementById('ui-score').textContent='得分 '+score;
  const hs=document.querySelectorAll('#hearts span');
  hs.forEach((s,i)=>s.className=i<player.hearts?'':'off');
}

/* ================= 绘制：狐狸 ================= */
/* o:{face(±1),pose,expr,blink,runF}  (fx,fy)=脚底中心屏幕坐标 */
function drawFox(fx,fy,o){
  const P=4;
  ctx.save();
  ctx.translate(fx,fy);
  if(o.inv&&Math.floor(o.inv/4)%2===0)ctx.globalAlpha=0.35;
  ctx.scale(o.face*P,P);
  const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h);};
  const HAIR='#f78fb8',HAIRD='#e56ba0',HAIRL='#ffb3d1',SKIN='#ffe8da',
        EYE='#f6a821',EYED='#b8781a',WHITE='#ffffff',WSHADE='#e9edf5',
        BOOT='#584a75',BOOT2='#473a61',BOW='#3d3350',PINK='#ff9fb2',
        MOUTH='#8a4652',TIP='#fff0f5',HEART='#f0569a';
  const pose=o.pose,t=frame;
  // 尾巴（最底层）
  if(pose==='jump'||pose==='fall'){
    R(-11,-12,3,5,HAIR);R(-13,-14,3,4,HAIR);R(-14,-14,2,2,TIP);
  }else if(pose==='run'){
    const sw=(o.runF%4<2)?1:0;
    R(-10,-7+sw,4,3,HAIR);R(-14,-6+sw,4,3,HAIR);R(-15,-5+sw,3,2,TIP);
  }else{
    const sw=Math.round(Math.sin(t*0.06));
    R(-10,-9,3,6,HAIR);R(-12,-8+sw,4,4,HAIR);R(-13,-7+sw,3,3,TIP);
  }
  // 后发
  R(-8,-14,3,8,HAIR);R(-8,-7,2,4,HAIRD);
  // 腿
  const legC='#6f5f8f';
  if(pose==='run'){
    const ph=o.runF%4;
    R(-4,-4,3,3,legC);R(2,-4,3,3,legC);
    if(ph===0){R(-6,-2,4,1,BOOT);R(-6,-1,4,1,BOOT2);R(2,-2,4,1,BOOT);R(2,-1,4,1,BOOT2);}
    else if(ph===2){R(-5,-2,4,1,BOOT);R(-5,-1,4,1,BOOT2);R(1,-2,4,1,BOOT);R(1,-1,4,1,BOOT2);}
    else{R(-4,-2,4,1,BOOT);R(-4,-1,4,1,BOOT2);R(1,-2,4,1,BOOT);R(1,-1,4,1,BOOT2);}
  }else if(pose==='jump'){
    R(-4,-4,3,3,legC);R(2,-4,3,3,legC);
    R(-5,-2,4,1,BOOT);R(-5,-1,4,1,BOOT2);R(2,-2,4,1,BOOT);R(2,-1,4,1,BOOT2);
  }else if(pose==='fall'){
    R(-5,-4,3,3,legC);R(3,-4,3,3,legC);
    R(-7,-2,4,1,BOOT);R(-7,-1,4,1,BOOT2);R(4,-2,4,1,BOOT);R(4,-1,4,1,BOOT2);
  }else{
    R(-4,-3,3,2,legC);R(2,-3,3,2,legC);
    R(-4,-2,4,1,BOOT);R(-4,-1,4,1,BOOT2);R(1,-2,4,1,BOOT);R(1,-1,4,1,BOOT2);
  }
  // 身体（白色大卫衣）
  if(pose==='fall'){R(-11,-11,3,4,WHITE);R(9,-11,3,4,WHITE);}
  if(pose==='win'){R(-10,-15,3,6,WHITE);R(8,-15,3,6,WHITE);R(-10,-16,3,1,WSHADE);R(8,-16,3,1,WSHADE);}
  R(-7,-9,15,2,WHITE);       // 上胸
  R(-8,-7,17,4,WHITE);       // 大袖子
  R(-7,-3,15,2,WSHADE);      // 下摆
  R(-5,-10,9,1,WSHADE);      // 领口
  R(-2,-9,1,2,'#d8dce8');R(1,-9,1,2,'#d8dce8'); // 抽绳
  // 袖子小爱心
  R(-8,-7,1,1,HEART);R(-6,-7,1,1,HEART);R(-8,-6,3,1,HEART);R(-7,-5,1,1,HEART);
  // 头
  R(-7,-17,15,2,HAIR);       // 顶
  R(-8,-15,17,4,HAIR);       // 主体
  R(-8,-11,4,1,HAIR);R(2,-11,5,1,HAIR); // 刘海
  R(-9,-11,2,6,HAIR);        // 左侧长发绺
  R(7,-11,2,3,HAIR);         // 右侧短发绺
  R(-4,-16,6,1,HAIRL);       // 高光
  // 脸
  R(-5,-12,11,4,SKIN);R(-3,-8,7,1,SKIN);
  R(-5,-9,2,1,PINK);R(4,-9,2,1,PINK); // 腮红
  // 耳朵
  const eUp=pose==='jump'?-1:(o.expr==='hurt'?1:0);
  // 左耳
  R(-6,-20+eUp,2,1,TIP);R(-7,-19+eUp,4,1,HAIR);R(-7,-18+eUp,4,1,HAIR);R(-6,-19+eUp,2,1,TIP);R(-6,-17+eUp,3,1,HAIR);
  // 右耳
  R(3,-20+eUp,3,1,TIP);R(2,-19+eUp,5,1,HAIR);R(2,-18+eUp,5,1,HAIR);R(3,-19+eUp,3,1,TIP);R(3,-17+eUp,4,1,HAIR);
  // 表情
  const E=o.expr;
  if(o.blink>0&&E==='normal'){
    R(-4,-11,3,1,EYED);R(2,-11,3,1,EYED);
  }else if(E==='happy'||E==='win'){
    R(-4,-11,1,1,EYED);R(-3,-12,2,1,EYED);R(-1,-11,1,1,EYED);
    R(2,-11,1,1,EYED);R(3,-12,2,1,EYED);R(5,-11,1,1,EYED);
  }else if(E==='hurt'){
    R(-4,-12,1,1,EYED);R(-3,-11,1,1,EYED);R(-2,-10,1,1,EYED);
    R(5,-12,1,1,EYED);R(4,-11,1,1,EYED);R(3,-10,1,1,EYED);
  }else{
    const eh=(pose==='jump'||pose==='fall')?3:2;
    R(-4,-11,3,eh,EYE);R(-4,-11,1,1,'#fff');R(2,-11,3,eh,EYE);R(2,-11,1,1,'#fff');
  }
  // 嘴
  if(E==='happy'){R(0,-8,3,2,MOUTH);R(1,-7,2,1,PINK);}
  else if(E==='win'){R(-1,-9,4,3,MOUTH);R(0,-7,3,1,PINK);}
  else if(E==='hurt'){R(-1,-8,2,1,MOUTH);R(2,-9,1,1,MOUTH);}
  else if(pose==='jump'||pose==='fall'){R(0,-9,2,2,MOUTH);}
  else{R(0,-8,2,1,MOUTH);R(2,-8,1,1,'#fff');}
  ctx.restore();
}

function drawCloudShape(x,y,s,a=1){
  ctx.save();ctx.globalAlpha=a;ctx.fillStyle='#ffffff';
  ctx.beginPath();
  ctx.arc(x,y,18*s,0,7);ctx.arc(x+22*s,y-8*s,14*s,0,7);ctx.arc(x+44*s,y,16*s,0,7);
  ctx.fill();ctx.restore();
}
function drawBackground(){

  g.addColorStop(0,th.sky[0]);g.addColorStop(1,th.sky[1]);

  // 太阳/月亮
  ctx.save();
  const sx=th.dusk?760:140,sy=th.dusk?90:80;
  ctx.fillStyle=th.sun;ctx.shadowColor=th.sun;ctx.shadowBlur=40;

  ctx.restore();

    for(let i=0;i<24;i++){const x=(i*173)%W,y=(i*67)%220;ctx.globalAlpha=0.3+0.5*Math.abs(Math.sin(frame*0.03+i));ctx.fillRect(x,y,2,2);}

  // 萤火虫
  if(th.dusk){fireflies.forEach(f=>{ctx.save();ctx.globalAlpha=0.4+0.5*Math.abs(Math.sin(f.ph*2));ctx.fillStyle='#d8ff9a';ctx.shadowColor='#d8ff9a';ctx.shadowBlur=8;ctx.fillRect(f.x-camX*0.8,f.y,3,3);ctx.restore();});}
}
function drawBlocks(){

      ctx.fillRect(x,y+9,b.w,b.h-9);

      // 草皮
      ctx.fillStyle='#93d97e';ctx.fillRect(x,y,b.w,9);
      ctx.fillStyle='#c0ecab';ctx.fillRect(x,y,b.w,3);

      for(let i=0;i<b.w/110;i++){const fx=x+((i*113+40)%b.w);ctx.fillRect(fx,y-4,2,2);ctx.fillStyle='#ffd0e4';ctx.fillRect(fx+5,y-3,2,2);ctx.fillStyle='#fff';}

      ctx.fill();
      ctx.fillStyle='rgba(200,225,255,.6)';ctx.fillRect(x+4,y+b.h-4,b.w-8,3);
      ctx.restore();
    }else if(b.type==='brick'){
      ctx.fillStyle='#dd8a5f';ctx.fillRect(x,y,32,32);
      ctx.fillStyle='#b96a44';
      ctx.fillRect(x,y+10,32,3);ctx.fillRect(x,y+21,32,3);
      ctx.fillRect(x+14,y,3,10);ctx.fillRect(x+25,y+13,3,8);ctx.fillRect(x+8,y+24,3,8);
      ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x,y,32,3);
    }else if(b.type==='question'){
      if(b.used){
        ctx.fillStyle='#d8cfc0';ctx.fillRect(x,y,32,32);
        ctx.fillStyle='rgba(120,110,95,.5)';ctx.fillRect(x,y,32,3);
      }else{
        const pulse=0.75+0.25*Math.sin(frame*0.1);
        ctx.fillStyle='#ffcf5c';ctx.fillRect(x,y,32,32);
        ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(x,y,32,4);
        ctx.fillStyle='#a86a1f';
        // 像素问号
        const q=['01110','11011','00011','00110','00100','00000','00100'];
        q.forEach((row,ry)=>{for(let cx=0;cx<5;cx++)if(row[cx]==='1')ctx.fillRect(x+9+cx*3,y+6+ry*3,3,3);});
        ctx.fillStyle='rgba(200,140,40,'+pulse+')';
        ctx.fillRect(x+3,y+3,3,3);ctx.fillRect(x+26,y+3,3,3);ctx.fillRect(x+3,y+26,3,3);ctx.fillRect(x+26,y+26,3,3);
      }
    }else if(b.type==='moving'){
      ctx.fillStyle='#e0a86e';ctx.fillRect(x,y,b.w,b.h);
      ctx.fillStyle='rgba(255,255,255,.35)';ctx.fillRect(x,y,b.w,3);
      ctx.fillStyle='#b8814f';ctx.fillRect(x,y+b.h-3,b.w,3);
      ctx.fillStyle='#fff';
      const chev=b.axis==='x'?'↔':'↕';
      ctx.font='12px monospace';ctx.textAlign='center';ctx.fillText(chev,x+b.w/2,y+15);
    }
  });
}

    const wave=Math.sin(frame*0.1)*3;
    ctx.fillStyle='#ff8fb8';
    ctx.beginPath();ctx.moveTo(x,GY-148);ctx.quadraticCurveTo(x+26,GY-142+wave,x+48,GY-136+wave);ctx.lineTo(x,GY-108+wave);ctx.quadraticCurveTo(x+24,GY-112+wave,x,GY-106);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x+20,GY-126+wave,4,0,7);ctx.fill();
    // 底座
    ctx.fillStyle='#e0a86e';ctx.fillRect(x-10,GY-8,20,8);
  }
}
function drawPetals(){
  const th=LEVELS[li];
  ctx.fillStyle=th.petal;
  petals.forEach(p=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=0.8;ctx.fillRect(-3,-2,6,4);ctx.fillStyle='#fff';ctx.globalAlpha=0.35;ctx.fillRect(-1,-2,2,4);ctx.fillStyle=th.petal;ctx.restore();});
}
function drawParticles(){
  particles.forEach(p=>{ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.fillRect(p.x-camX-p.size/2,p.y-p.size/2,p.size,p.size);});
  ctx.globalAlpha=1;
  confetti.forEach(c=>{ctx.save();ctx.translate(c.x-camX,c.y);ctx.rotate(c.rot);ctx.fillStyle=c.color;ctx.fillRect(-3,-2,6,4);ctx.restore();});
  floaters.forEach(f=>{ctx.globalAlpha=Math.min(1,f.life/25);ctx.font='13px "ZCOOL KuaiLe",monospace';ctx.textAlign='center';ctx.fillStyle=f.color;ctx.fillText(f.text,f.x-camX,f.y);ctx.globalAlpha=1;});
}
function drawShadow(){
  // 找脚下最近平台
  let gy=null;
  for(const b of level.blocks){
    if(b.dead)continue;
    if(player.x>b.x-6&&player.x<b.x+b.w+6&&b.y>=player.y+player.h/2-4){
      if(gy===null||b.y<gy)gy=b.y;
    }
  }
  if(gy===null||gy-(player.y+player.h/2)>160)return;
  const d=gy-(player.y+player.h/2);
  const a=0.28*(1-d/160);
  ctx.fillStyle='rgba(90,60,90,'+a+')';
  ctx.beginPath();ctx.ellipse(player.x-camX,gy+4,16*(1-d/300),4,0,0,7);ctx.fill();
}
function drawPlayer(){
  const p=player;
  const sx=p.x-camX,sy=p.y;
  let pose='idle';
  if(state==='clear'||state==='win')pose='win';
  else if(!p.onGround)pose=p.vy<0?'jump':'fall';
  else if(Math.abs(p.vx)>0.6)pose='run';
  const runF=Math.floor(frame/6);
  // 胜利弹跳
  let oy=0;
  if(pose==='win')oy=-Math.abs(Math.sin(frame*0.22))*5;
  drawShadow();
  drawFox(sx,sy+p.h/2+oy,{face:p.facing,pose,expr:p.expr,blink:p.blink,runF,inv:p.inv});
}

/* ================= 主绘制 ================= */
function draw(){
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if(shake>0)ctx.translate((Math.random()-0.5)*shake*0.7,(Math.random()-0.5)*shake*0.7);
  drawBackground();
  if(level){
    drawFlags();
    drawBlocks();
    drawCoinsItems();
    drawEnemies();
    drawPetals();
    drawPlayer();
    drawParticles();
  }
  ctx.restore();
}

/* ================= 循环 ================= */
function loop(){
  update();
  draw();
  requestAnimationFrame(loop);
}
/* 菜单状态：预载第一关做背景 */
loadLevel(0);
state='menu';
loop();
</script>
